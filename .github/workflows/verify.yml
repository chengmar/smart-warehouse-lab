name: 实验验收
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: artifacts/}
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: warehouse_test, MYSQL_USER: warehouse, MYSQL_PASSWORD: lab_test_only, MYSQL_ROOT_PASSWORD: local_root_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env: {DB_DRIVER: mysql, MYSQL_DATABASE: warehouse_test, MYSQL_USER: warehouse, MYSQL_PASSWORD: lab_test_only}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: 启动独立的 Compose 部署并检查数据库读写
        run: |
          docker compose up --build --detach --wait
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3210/api/health | jq -e '.driver == "mysql"'; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3210/api/health | jq -e '.driver == "mysql"'
          curl --fail --silent -c /tmp/warehouse-cookie -H 'Content-Type: application/json' -d '{"username":"admin","password":"Warehouse2026!"}' http://localhost:3210/api/login | jq -e '.role == "ADMIN"'
          curl --fail --silent -b /tmp/warehouse-cookie -H 'Content-Type: application/json' -H 'Idempotency-Key: compose-smoke-receipt' -d '{"product_id":"P01","location_id":"A-04","batch":"COMPOSE","quantity":3,"expiry":"2099-01-01","supplier":"部署验收"}' http://localhost:3210/api/receipts | jq -e '.qty == 3'
          curl --fail --silent -b /tmp/warehouse-cookie http://localhost:3210/api/reconcile | jq -e '.ok == true'
      - if: failure()
        run: docker compose logs --tail=80
