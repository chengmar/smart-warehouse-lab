name: 实验验收
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: artifacts/}
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: warehouse_test, MYSQL_USER: warehouse, MYSQL_PASSWORD: lab_test_only, MYSQL_ROOT_PASSWORD: local_root_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env: {DB_DRIVER: mysql, MYSQL_DATABASE: warehouse_test, MYSQL_USER: warehouse, MYSQL_PASSWORD: lab_test_only}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
