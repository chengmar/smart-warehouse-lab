services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course_db_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-course_root_local}
    volumes:
      - warehouse-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 4s
      retries: 30
  app:
    build: .
    environment:
      DB_DRIVER: mysql
      MYSQL_HOST: db
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course_db_local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Warehouse2026!}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3210}:3210"
volumes:
  warehouse-data:
